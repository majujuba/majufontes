<title>flor e pixels — azul</title>
<style>
  /* ===== cores (troque à vontade) ===== */
  :root{
    --fundo:#ffffff;
    --roxo:#3f3166;
    --linha:#7fabdf;   /* azul da linha (mesmo tom da imagem antiga do card) */
    --pixel:#d8d8d8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{ --fundo:#ffffff; }
  html,body{height:100%;margin:0}
  body{background:var(--fundo);display:grid;place-items:center;overflow:hidden}
  svg{width:min(96vw,1400px);height:auto;max-height:96%;overflow:visible}
  .st0{fill:var(--roxo)}
  .st1{fill:var(--pixel)}
</style>
<style>
  /* fundo transparente para ficar dentro do card; o desenho ocupa a caixa inteira */
  html,body{background:transparent!important}
  svg{width:100%!important;height:100%!important;max-height:none!important;min-height:0!important}
</style>
<style>
  /* esconde a linha e os pixels antes do primeiro desenho da página; o script libera no fim da animação */
  html.esconde-inicio #traco, html.esconde-inicio #pixels > * { opacity: 0; }
</style>
<script>
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('esconde-inicio');
    /* segurança: se algo falhar, mostra tudo depois de 10 s */
    setTimeout(() => document.documentElement.classList.remove('esconde-inicio'), 10000);
  }
</script>
</head>

<script>
/* ================== AJUSTES ================== */
const NIVEIS = [1, 0.8, 0.5];                // opacidade dos pixels: 100%, 80% e 50% (como era no contact)
const PAUSA_MIN = 250, PAUSA_MAX = 2600;     // quanto tempo cada pixel fica parado (ms)
const FADE_MIN = 60,  FADE_MAX = 650;        // duração da troca (ms)
const DESENHO_MS = 2000;                     // duração do traço se desenhando (ms)
const CANETAS = 12;                          // quantos trechos se desenham ao mesmo tempo (mais = cada um mais calmo)
const FINAL_MS = 700;                        // esmaecimento final que completa o desenho (ms)
const OPACIDADE_GRADUAL = true;              // teste: o traço começa com 0% de opacidade e termina com 100% (false = desliga)
const OPACIDADE_MS = 1900;                   // em quanto tempo a opacidade vai de 0% a 100% (ms)
const PONTA_SUAVE = 1.5;                     // suavidade da borda do traço enquanto desenha (0 = seca)
const PIXEL_SURGE_MIN = 700, PIXEL_SURGE_MAX = 1400;   // quanto cada pixel leva para surgir quando a caneta passa (ms)
const DESENHO_ATRASO = 300;                  // espera antes de começar a desenhar (ms)
const INICIO = 'esquerda';                   // de onde o traço começa: 'esquerda' ou 'direita'
const LINHA_ACIMA = false;        // a linha fica por cima dos pixels?
const ONDA_AMPLITUDE = 9;                   // força da ondulação (fica ligada o tempo todo)
const ONDA_VELOCIDADE = 1;                   // 1 = normal, 0.5 = mais lenta
/* ============================================ */

const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const vel = calmo ? 0.3 : 1;
/* "?sem-desenho" no endereço: a flor já aparece pronta (só ondula e os pixels piscam) */
const SEM_DESENHO = /[?&]sem-desenho/.test(location.search);
const jaPronta = calmo || SEM_DESENHO;
const rnd = (a,b)=>a+Math.random()*(b-a);
const suave = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

/* ---------- pixels piscando ---------- */
/* campo de "maré" lento: faz regiões vizinhas tenderem ao mesmo brilho */
function mare(x,y,t){
  return ( Math.sin(x*0.011 + t*0.00031) +
           Math.sin(y*0.017 - t*0.00023) +
           Math.sin((x+y)*0.007 + t*0.00041) ) / 3;   // -1..1
}
function escolheNivel(p,t,atual){
  const m = mare(p.cx,p.cy,t);                 // >0 favorece aceso, <0 favorece apagado
  const pesos = [1.2+m*1.4, 1, 0.9-m*1.2].map(v=>Math.max(.05,v));
  let opcoes = NIVEIS.map((n,i)=>({n,w:pesos[i]})).filter(o=>o.n!==atual);
  let soma = opcoes.reduce((a,o)=>a+o.w,0), r=Math.random()*soma;
  for(const o of opcoes){ if((r-=o.w)<=0) return o.n; }
  return opcoes[0].n;
}

/* ---------- desempenho: pixels numa camada própria ----------
   Antes os pixels ficavam no mesmo SVG da linha com filtro: cada pixel que piscava
   obrigava o navegador a refazer o filtro da linha inteira. Agora são duas camadas. */
(function separaCamadas(){
  const estilo = document.createElement('style');
  estilo.textContent = 'body{position:relative}svg{position:absolute!important;inset:0;will-change:transform}';
  document.head.appendChild(estilo);
  const svgLinha = document.querySelector('svg'), gPix = document.getElementById('pixels');
  if(!svgLinha || !gPix) return;
  const svgPix = svgLinha.cloneNode(false);
  svgPix.removeAttribute('aria-label'); svgPix.setAttribute('aria-hidden', 'true');
  svgPix.appendChild(gPix);
  svgLinha.style.willChange = svgPix.style.willChange = 'transform';   // camadas separadas: piscar os pixels nÃ£o refaz o filtro da linha
  svgLinha.parentNode.insertBefore(svgPix, LINHA_ACIMA ? svgLinha : svgLinha.nextSibling);
})();

/* com o desenho ligado, os pixels começam invisíveis e surgem quando a caneta passa perto */
const pixels = [...document.querySelectorAll('#pixels > *')].map(el=>{
  const b = el.getBBox();
  const ini = jaPronta ? NIVEIS[Math.floor(Math.random()*3)] : 0;
  el.style.opacity = ini;
  return {el, cx:b.x+b.width/2, cy:b.y+b.height/2, surge:0, apareceu:jaPronta,
          de:ini, para:ini, inicio:0, dur:1,
          proxima: jaPronta ? performance.now()+rnd(0,PAUSA_MAX) : Infinity};
});
function fazSurgir(p,t){
  p.apareceu = true;
  p.de = 0; p.para = Math.random()<0.6 ? 1 : 0.5;
  p.inicio = t; p.dur = rnd(PIXEL_SURGE_MIN,PIXEL_SURGE_MAX);
  p.proxima = t + p.dur + rnd(PAUSA_MIN,PAUSA_MAX);
}

/* ---------- ondulação da linha: ligada o tempo todo, inclusive enquanto desenha ---------- */
const traco = document.getElementById('traco');
const ruido = document.getElementById('ruido');
const desloca = document.getElementById('desloca');

/* desempenho: a animação para quando a flor sai da tela, e a ondulação (o filtro mais
   pesado) é atualizada a ~30 quadros por segundo, o bastante para um movimento lento */
// no celular (toque) a ondulação fica parada (ver ONDA_INTERVALO) e os pixels esmaecem por transição CSS: o iPhone travava
const TOQUE = matchMedia("(hover: none), (pointer: coarse)").matches;
const ONDA_INTERVALO = TOQUE ? 66 : 33;   // celular: a linha volta a ondular (pedido dela), a ~15 quadros/s para não pesar; parada enquanto a página rola
let visivel = true, rodando = false, ultimaOnda = -1e9;
function liga(){ if(!rodando){ rodando = true; requestAnimationFrame(quadro); } }
if('IntersectionObserver' in window){
  new IntersectionObserver(es => { visivel = es[es.length-1].isIntersecting; if(visivel) liga(); })
    .observe(document.documentElement);
}

/* desempenho: relÃ³gio prÃ³prio da ondulaÃ§Ã£o (pausa enquanto a pÃ¡gina de fora rola) e pixels a ~30 quadros/s */
let pausada = false, tempoOnda = performance.now(), ultimoT = null, ultimoPix = -1e9;
addEventListener('message', e => { if(e.data === 'onda-pausa') pausada = true; else if(e.data === 'onda-segue') pausada = false; });
function quadro(t){
  const dt = ultimoT === null ? 0 : Math.min(100, t - ultimoT); ultimoT = t;
  if(!pausada) tempoOnda += dt;
  const vezPix = t - ultimoPix >= (TOQUE ? 100 : 33); if(vezPix) ultimoPix = t;  if(!visivel){ rodando = false; ultimoT = null; return; }
  if(vezPix) for(const p of pixels){
    if(t >= p.proxima){
      p.de = p.para;
      p.para = escolheNivel(p,t,p.de);
      p.inicio = t;
      p.dur = rnd(FADE_MIN,FADE_MAX)/vel;
      p.proxima = t + p.dur + rnd(PAUSA_MIN,PAUSA_MAX)/vel;
    }
    if(t - p.inicio <= p.dur + 40){
      if(TOQUE){   // celular: o próprio navegador faz o esmaecimento (transição CSS), sem o script mexer em cada pixel a cada quadro
        if(p.css !== p.inicio){ p.css = p.inicio; p.el.style.transition = "opacity "+Math.max(0,Math.round(p.inicio+p.dur-t))+"ms cubic-bezier(.65,0,.35,1)"; p.el.style.opacity = p.para; }
      } else {
        const k = suave(Math.min(1,(t-p.inicio)/p.dur));
        p.el.style.opacity = (p.de + (p.para-p.de)*k).toFixed(3);
      }
    }
  }
  if(!pausada && t - ultimaOnda >= ONDA_INTERVALO){
    ultimaOnda = t;
    const tt = tempoOnda*0.001*ONDA_VELOCIDADE*vel;
    const fx = 0.009 + 0.0025*Math.sin(tt*0.37) + 0.0012*Math.sin(tt*0.91);
    const fy = 0.011 + 0.0025*Math.cos(tt*0.29) + 0.0012*Math.sin(tt*0.73+1);
    ruido.setAttribute('baseFrequency', fx.toFixed(5)+' '+fy.toFixed(5));
    desloca.setAttribute('scale', (ONDA_AMPLITUDE*(0.75+0.25*Math.sin(tt*0.53))).toFixed(2));
  }
  requestAnimationFrame(quadro);
}
liga();

// já começa a calcular o caminho do traço (fora da linha principal), enquanto a página termina de abrir
if(!SEM_DESENHO && !jaPronta) caminhoPronto = preparaCaminho();

/* com "?esperar" no endereço (dentro da Home), espera a tela de carregamento sair */
let comecou = false;
function comecar(){
  if(comecou) return; comecou = true;
  if(!jaPronta) desenhaTraco();
  else document.documentElement.classList.remove('esconde-inicio');
}
if(SEM_DESENHO) comecar();
else if(/[?&]esperar/.test(location.search) && window.parent !== window){
  addEventListener('message', e => { if(e.data === 'comecar') comecar(); });
  parent.postMessage('flor-pronta', '*');
  setTimeout(comecar, 8000);               // segurança: começa sozinha se o aviso não vier
} else comecar();

/* ---------- traço se desenhando uma vez ----------
   A linha original (PNG) fica sempre na página, ondulando. Uma máscara feita
   do "miolo" da própria linha vai revelando a imagem, como várias canetas
   correndo ao mesmo tempo. No fim, um esmaecimento completa o que faltar. */
function calculaCaminho(s,W,H){
  const N = W*H;
  const viz = [-W-1,-W,-W+1,-1,1,W-1,W,W+1];
  const vx = [-1,0,1,-1,1,-1,0,1], vy = [-1,-1,-1,0,0,1,1,1];

  /* 1. miolo da linha (afinamento Zhang-Suen) */
  const sk = new Uint8Array(N);
  let pts = [];
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    const i=y*W+x; if(s[i*4+3]>=110){ sk[i]=1; pts.push(i); }
  }
  let mudou = true;
  while(mudou){
    mudou = false;
    for(let passo=0;passo<2;passo++){
      const rem = [];
      for(const i of pts){
        if(!sk[i]) continue;
        const p2=sk[i-W],p3=sk[i-W+1],p4=sk[i+1],p5=sk[i+W+1],p6=sk[i+W],p7=sk[i+W-1],p8=sk[i-1],p9=sk[i-W-1];
        const B=p2+p3+p4+p5+p6+p7+p8+p9; if(B<2||B>6) continue;
        const A=(!p2&&p3)+(!p3&&p4)+(!p4&&p5)+(!p5&&p6)+(!p6&&p7)+(!p7&&p8)+(!p8&&p9)+(!p9&&p2);
        if(A!==1) continue;
        if(passo===0){ if(p2&&p4&&p6) continue; if(p4&&p6&&p8) continue; }
        else         { if(p2&&p4&&p8) continue; if(p2&&p6&&p8) continue; }
        rem.push(i);
      }
      for(const i of rem) sk[i]=0;
      if(rem.length) mudou = true;
    }
    pts = pts.filter(i=>sk[i]);
  }

  /* 2. percorre o miolo como uma caneta */
  const vis = new Uint8Array(N);
  const livres = i => { let n=0; for(let k=0;k<8;k++){ const j=i+viz[k]; if(sk[j]&&!vis[j]) n++; } return n; };
  const tracos = [];
  const R = 6;
  let L = 0, px = null, py = null;
  const BUSCA = 80;
  function pertoDaCaneta(){                      // ponto livre mais perto da caneta, preferindo pontas
    let qualquer=-1, rq=0;
    for(let r=1;r<=BUSCA;r++){
      if(qualquer>=0 && r>rq+12) return qualquer;
      let ponta=-1, pd=Infinity;
      for(let oy=-r;oy<=r;oy++){
        const passoX = (oy===-r||oy===r) ? 1 : 2*r;
        for(let ox=-r;ox<=r;ox+=passoX){
          const xx=px+ox, yy=py+oy; if(xx<1||yy<1||xx>=W-1||yy>=H-1) continue;
          const j=yy*W+xx; if(!sk[j]||vis[j]) continue;
          if(qualquer<0){ qualquer=j; rq=r; }
          if(livres(j)<=1){ const d=ox*ox+oy*oy; if(d<pd){ pd=d; ponta=j; } }
        }
      }
      if(ponta>=0) return ponta;
    }
    return qualquer;
  }
  while(true){
    let ini=-1;
    if(px!==null) ini = pertoDaCaneta();
    if(ini<0){
      pts = pts.filter(i=>!vis[i]);
      if(!pts.length) break;
      let melhor=Infinity;
      for(const i of pts){
        const x=i%W, y=(i/W)|0;
        let sc = px===null ? (INICIO==='direita' ? W-x : x) : Math.hypot(x-px,y-py);
        if(livres(i)>1) sc += 1e7;               // prefere começar numa ponta
        if(sc<melhor){ melhor=sc; ini=i; }
      }
    }
    const linha = [ini]; vis[ini]=1;
    let cur = ini;
    while(true){
      const cx=cur%W, cy=(cur/W)|0;
      let dx=0, dy=0, temDir=false;
      if(linha.length>=3){
        const h=linha[Math.max(0,linha.length-9)];
        dx=cx-h%W; dy=cy-((h/W)|0);
        const n=Math.hypot(dx,dy); if(n>0){ dx/=n; dy/=n; temDir=true; }
      }
      let nxt=-1, ns=-Infinity;
      for(let k=0;k<8;k++){
        const j=cur+viz[k]; if(!sk[j]||vis[j]) continue;
        const l=Math.hypot(vx[k],vy[k]);
        const sc = temDir ? (vx[k]*dx+vy[k]*dy)/l : (l===1?1:0);
        if(temDir && sc<-0.3) continue;            // não volta para trás
        if(sc>ns){ ns=sc; nxt=j; }
      }
      if(nxt<0 && temDir){                          // atravessa o cruzamento em frente
        let bd=Infinity;
        for(let oy=-R;oy<=R;oy++) for(let ox=-R;ox<=R;ox++){
          const d=Math.hypot(ox,oy); if(d<1.5||d>R) continue;
          const xx=cx+ox, yy=cy+oy; if(xx<1||yy<1||xx>=W-1||yy>=H-1) continue;
          const j=yy*W+xx; if(!sk[j]||vis[j]) continue;
          if((ox*dx+oy*dy)/d<0.8) continue;
          if(d<bd){ bd=d; nxt=j; }
        }
      }
      if(nxt<0) break;
      /* cantinhos da "escadinha" (vizinhos de cur e de nxt ao mesmo tempo) já ficam vistos */
      const ax=nxt%W, ay=(nxt/W)|0;
      for(let k=0;k<8;k++){
        const j=cur+viz[k]; if(!sk[j]||vis[j]||j===nxt) continue;
        if(Math.abs(j%W-ax)<=1 && Math.abs(((j/W)|0)-ay)<=1) vis[j]=1;
      }
      vis[nxt]=1; linha.push(nxt); cur=nxt;
    }
    if(linha.length>=4){ tracos.push(linha); px=cur%W; py=(cur/W)|0; }   // pedacinhos soltos não contam
  }

  /* 3. largura típica da linha */
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  const cheio = (x,y) => x>=0 && y>=0 && x<W && y<H && s[(y*W+x)*4+3]>=110;
  function largura(i){
    const x=i%W, y=(i/W)|0; let menor=Infinity;
    for(const [dx,dy] of dirs){
      let a=0; while(a<30 && cheio(x+dx*(a+1), y+dy*(a+1))) a++;
      let b=0; while(b<30 && cheio(x-dx*(b+1), y-dy*(b+1))) b++;
      menor = Math.min(menor, (a+b+1)*((dx&&dy)?Math.SQRT2:1));
    }
    return menor;
  }
  const amostra = [];
  for(const tr of tracos) for(let n=0;n<tr.length;n+=7) amostra.push(largura(tr[n]));
  amostra.sort((a,b)=>a-b);
  const larg = amostra.length ? amostra[(amostra.length/2)|0] : 3;

  /* 4. divide o caminho em trechos iguais, um para cada caneta */
  for(const tr of tracos){ let p=tr[0]; for(const i of tr){ L += Math.hypot(i%W-p%W, ((i/W)|0)-((p/W)|0)); p=i; } }
  const K = Math.max(1, Math.round(CANETAS)), seg = (L/K) || 1;
  const pecas = [], marcos = [];
  let c = 0;
  for(const tr of tracos){
    let k = Math.min(K-1, Math.floor(c/seg));
    let atual = {pts:[tr[0]], a:c-k*seg};
    let prev = tr[0];
    for(let n=1;n<tr.length;n++){
      const i = tr[n];
      c += Math.hypot(i%W-prev%W, ((i/W)|0)-((prev/W)|0)); prev = i;
      atual.pts.push(i);
      if(n%3===0) marcos.push(i%W, (i/W)|0, c-k*seg);
      const kk = Math.min(K-1, Math.floor(c/seg));
      if(kk!==k){
        atual.b = c-k*seg; if(atual.b>atual.a) pecas.push(atual);
        k = kk; atual = {pts:[i], a:c-k*seg};
      }
    }
    atual.b = c-k*seg;
    if(atual.pts.length>=2 && atual.b>atual.a) pecas.push(atual);
  }
  return {pecas, seg, larg, marcos:new Float32Array(marcos)};
}

/* desempenho: lê os pixels do traço e calcula o caminho da "caneta" (calculaCaminho, o mesmo de sempre) num Web Worker,
   começando assim que a flor abre — o resultado é idêntico, mas não trava a página (na Home isso acontece por trás da
   tela de carregamento). Se o Worker não puder ser criado, calcula aqui mesmo, como antes. */
var caminhoPronto;   // var: é preenchida antes desta linha (no começo da página)
async function preparaCaminho(){
  const img = new Image();
  img.src = traco.getAttribute('href');
  await img.decode();
  const ESC = 0.5;                                   // resolução de trabalho
  const W = Math.round(img.naturalWidth*ESC), H = Math.round(img.naturalHeight*ESC);
  const leitor = document.createElement('canvas'); leitor.width = W; leitor.height = H;
  const lctx = leitor.getContext('2d', {willReadFrequently:true});
  lctx.drawImage(img,0,0,W,H);
  const s = lctx.getImageData(0,0,W,H).data;
  let r = null;
  try{
    const codigo = 'const INICIO='+JSON.stringify(INICIO)+',CANETAS='+JSON.stringify(CANETAS)+';'+calculaCaminho.toString()+
      ';onmessage=e=>postMessage(calculaCaminho(e.data.s,e.data.W,e.data.H));';
    const url = URL.createObjectURL(new Blob([codigo],{type:'text/javascript'}));
    const tr = new Worker(url);
    r = await new Promise((ok,erro)=>{ tr.onmessage = e=>ok(e.data); tr.onerror = erro; tr.postMessage({s,W,H},[s.buffer]); });
    tr.terminate(); URL.revokeObjectURL(url);
  }catch(e){ r = null; }
  if(!r){ lctx.drawImage(img,0,0,W,H); r = calculaCaminho(lctx.getImageData(0,0,W,H).data,W,H); }
  return Object.assign({W,H}, r);
}
async function desenhaTraco(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = traco.ownerSVGElement;
  const cria = (nome, attrs) => { const el=document.createElementNS(NS,nome); for(const k in attrs) el.setAttribute(k,attrs[k]); return el; };
  let defs = svg.querySelector('defs');
  if(!defs){ defs = cria('defs',{}); svg.prepend(defs); }
  const nw = +traco.getAttribute('width'), nh = +traco.getAttribute('height');

  /* máscara: começa escondendo tudo */
  const area = {maskUnits:'userSpaceOnUse', x:-0.05*nw, y:-0.05*nh, width:1.1*nw, height:1.1*nh};
  const mascara = cria('mask', Object.assign({id:'revela'}, area));
  const borra = cria('filter', {id:'borra-traco', x:'-5%', y:'-5%', width:'110%', height:'110%'});
  const blur = cria('feGaussianBlur', {stdDeviation:'0'});
  borra.append(blur);
  const tracos = cria('g', PONTA_SUAVE>0 ? {filter:'url(#borra-traco)'} : {});
  const cobre = cria('rect', {x:area.x, y:area.y, width:area.width, height:area.height, fill:'#fff', opacity:'0'});
  mascara.append(tracos, cobre);
  defs.append(borra, mascara);
  traco.setAttribute('mask','url(#revela)');
  const opacidade = ms => { if(OPACIDADE_GRADUAL) traco.style.opacity = Math.max(0,Math.min(1,ms/OPACIDADE_MS)).toFixed(3); };
  opacidade(0);

  try{
    // desempenho: o caminho já foi calculado (ou está sendo) fora da linha principal, desde que a flor abriu — ver preparaCaminho
    const {W, H, pecas, seg, larg, marcos} = await (caminhoPronto || preparaCaminho());

    /* um traço da máscara para cada pedaço do caminho (em pixels da imagem) */
    const fx = nw/W, fy = nh/H;
    const espessura = (larg*1.5 + 6)*fx;
    blur.setAttribute('stdDeviation', (PONTA_SUAVE*fx).toFixed(2));
    for(const pc of pecas){
      let d = '';
      for(let n=0;n<pc.pts.length;n++){
        if(n%2 && n!==pc.pts.length-1) continue;
        const i = pc.pts[n];
        d += (d?'L':'M') + ((i%W+.5)*fx).toFixed(1) + ' ' + ((((i/W)|0)+.5)*fy).toFixed(1);
      }
      pc.el = cria('path', {d, fill:'none', stroke:'#fff', 'stroke-width':espessura.toFixed(1),
        'stroke-linecap':'round', 'stroke-linejoin':'round', pathLength:'1',
        'stroke-dasharray':'1 1', 'stroke-dashoffset':'1', visibility:'hidden'});
      tracos.append(pc.el);
    }
    pecas.sort((p,q)=>p.a-q.a);

    /* quando a caneta passa perto de cada pixel */
    const inv = traco.transform.baseVal.consolidate();
    const M = inv ? inv.matrix.inverse() : new DOMMatrix();
    for(const p of pixels){
      const ix = (M.a*p.cx + M.c*p.cy + M.e)/fx, iy = (M.b*p.cx + M.d*p.cy + M.f)/fy;
      let melhor = Infinity, t = 0;
      for(let m=0;m<marcos.length;m+=3){
        const dx=marcos[m]-ix, dy=marcos[m+1]-iy, dd=dx*dx+dy*dy;
        if(dd<melhor){ melhor=dd; t=marcos[m+2]; }
      }
      p.surge = t;
    }
    const filaPixels = pixels.slice().sort((a,b)=>a.surge-b.surge);
    let proxPixel = 0;

    const t0 = performance.now()+DESENHO_ATRASO;
    let feitos = 0;
    await new Promise(fim=>{
      function passo(t){
        const p = Math.max(0,Math.min(1,(t-t0)/DESENHO_MS));
        const e = 0.6*p + 0.4*(1-Math.cos(Math.PI*p))/2;   // velocidade quase constante, sai e chega macio
        const lim = e*seg;
        for(let j=feitos;j<pecas.length;j++){
          const pc = pecas[j];
          if(pc.a >= lim) break;                       // ainda não começou (estão em ordem)
          if(pc.pronto) continue;
          const f = Math.min(1,(lim-pc.a)/(pc.b-pc.a));
          if(!pc.visto){ pc.el.setAttribute('visibility','visible'); pc.visto = true; }
          pc.el.setAttribute('stroke-dashoffset', (1-f).toFixed(4));
          if(f>=1) pc.pronto = true;
        }
        while(feitos<pecas.length && pecas[feitos].pronto) feitos++;
        while(proxPixel<filaPixels.length && filaPixels[proxPixel].surge<=lim) fazSurgir(filaPixels[proxPixel++], t);
        opacidade(p*DESENHO_MS);
        if(p<1) requestAnimationFrame(passo); else fim();
      }
      requestAnimationFrame(passo);
    });

    /* final: completa suavemente o que a máscara não cobriu */
    const tf = performance.now();
    await new Promise(fim=>{
      function some(t){
        const k = Math.max(0,Math.min(1,(t-tf)/FINAL_MS));
        cobre.setAttribute('opacity', suave(k).toFixed(3));
        opacidade(DESENHO_MS + k*FINAL_MS);
        if(k<1) requestAnimationFrame(some); else fim();
      }
      requestAnimationFrame(some);
    });
  }catch(e){ console.warn('traço:', e); }
  const agora = performance.now();
  for(const p of pixels) if(!p.apareceu) fazSurgir(p, agora);   // garante que nenhum pixel fique de fora
  traco.removeAttribute('mask');                       // a imagem fica inteira, como no original
  traco.style.opacity = '';
  document.documentElement.classList.remove('esconde-inicio');   // libera o que o <head> escondeu
  mascara.remove(); borra.remove();
}
</script>
